<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #2c3e50;
    color: #fff;
    flex-wrap: wrap;
  }

  .topbar label { font-size: 0.85rem; color: #aaa; }

  .nav-btn {
  padding: 5px 10px;
  border-radius: 6px;
  border: none;
  background: #3d5166;
  color: #fff;
  cursor: pointer;
  font-size: 0.85rem;
  }
  .nav-btn:hover { background: #4a90e2; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  select {
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    font-size: 0.85rem;
    background: #3d5166;
    color: #fff;
    cursor: pointer;
    outline: none;
  }
  select:focus { outline: 2px solid #4a90e2; }

  .sheet-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  .sheet-tab {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #f4f4f4;
    color: #555;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .sheet-tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
  .sheet-tab.chart { background: #f4f4f4; color: #aaa; cursor: not-allowed; font-style: italic; }

  .row-count { margin-left: auto; font-size: 0.8rem; color: #aaa; white-space: nowrap; }

  .status {
    padding: 40px;
    text-align: center;
    color: #888;
    font-size: 0.9rem;
  }

  .table-container { flex: 1; overflow: auto; }

  table { border-collapse: collapse; width: 100%; min-width: max-content; font-size: 0.85rem; }

  thead th {
    position: sticky;
    top: 0;
    background: #2c3e50;
    color: #fff;
    padding: 10px 14px;
    text-align: left;
    white-space: pre-line; /* 줄바꿈 처리 */
    border-right: 1px solid #3d5166;
    font-weight: 600;
    font-size: 0.8rem;
    line-height: 1.4;
  }

  tbody tr:nth-child(even) { background: #f8f9fa; }
  tbody tr:nth-child(odd) { background: #fff; }
  tbody tr:hover { background: #e8f0fe; }

  tbody td {
    padding: 8px 14px;
    border-bottom: 1px solid #eee;
    border-right: 1px solid #eee;
    white-space: nowrap;
    vertical-align: middle;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f0f0f0; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>

<script>
// ↓↓↓ 파일 목록 여기에 추가하세요 ↓↓↓
const FILES = [
  'excel_file/5월 생활가전 판매 현황.xlsx',
  'excel_file/드론판매현황.xlsx',
  'excel_file/야생화 씨앗 판매 현황.xlsx',
  'excel_file/온라인 가전제품 판매 현황.xlsx',
  'excel_file/자동차판매현황.xlsx',
  'excel_file/전기자동차 연비 현황.xlsx',
  'excel_file/차건강한 차 판매 현황.xlsx'
];
// ↑↑↑ 파일 목록 여기에 추가하세요 ↑↑↑
</script>

<div class="topbar">
  <label>파일 선택</label>
  <button class="nav-btn" onclick="changeFile(-1)">◀</button>
  <select id="fileSelect" onchange="loadFile(this.value)"></select>
  <button class="nav-btn" onclick="changeFile(1)">▶</button>
  <select id="fileSelect" onchange="loadFile(this.value)"></select>
  <div class="sheet-tabs" id="sheetTabs"></div>
  <span class="row-count" id="rowCount"></span>
</div>

<div id="content">
  <div class="status">불러오는 중...</div>
</div>

<script>
let workbook = null;

// 파일 목록 드롭다운 생성
const sel = document.getElementById('fileSelect');
FILES.forEach(f => {
  const opt = document.createElement('option');
  opt.value = f;
  // 경로 제거하고 파일명만 표시
  opt.textContent = f.split('/').pop().replace('.xlsx','').replace('.xls','');
  sel.appendChild(opt);
});

// 첫 번째 파일 자동 로드
if (FILES.length > 0) loadFile(FILES[0]);

function loadFile(path) {
  document.getElementById('content').innerHTML = '<div class="status">불러오는 중...</div>';
  document.getElementById('sheetTabs').innerHTML = '';
  document.getElementById('rowCount').textContent = '';

  fetch(path)
    .then(res => {
      if (!res.ok) throw new Error(`파일을 찾을 수 없습니다: ${path}`);
      return res.arrayBuffer();
    })
    .then(data => {
      workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
      buildTabs();
      // 첫 번째 데이터 시트(차트 시트 제외)를 자동 선택
      const firstDataSheet = workbook.SheetNames.find(name => {
        const ws = workbook.Sheets[name];
        return ws['!type'] !== 'chart' && Object.keys(ws).filter(k => !k.startsWith('!')).length > 0;
      });
      if (firstDataSheet) loadSheet(firstDataSheet);
    })
    .catch(err => {
      document.getElementById('content').innerHTML = `<div class="status">⚠️ ${err.message}</div>`;
    });
}

function buildTabs() {
  const tabs = document.getElementById('sheetTabs');
  tabs.innerHTML = '';
  workbook.SheetNames.forEach(name => {
    const ws = workbook.Sheets[name];
    const isChart = ws['!type'] === 'chart';
    const btn = document.createElement('button');
    btn.className = 'sheet-tab' + (isChart ? ' chart' : '');
    btn.textContent = name + (isChart ? ' (차트)' : '');
    if (!isChart) btn.onclick = () => loadSheet(name);
    tabs.appendChild(btn);
  });
}

function changeFile(direction) {
  const sel = document.getElementById('fileSelect');
  const newIndex = sel.selectedIndex + direction;
  if (newIndex < 0 || newIndex >= FILES.length) return;
  sel.selectedIndex = newIndex;
  loadFile(FILES[newIndex]);
}

function loadSheet(name) {
  document.querySelectorAll('.sheet-tab').forEach(t => {
    t.classList.toggle('active', t.textContent === name);
  });

  const ws = workbook.Sheets[name];
  // 첫 번째 열이 전부 비어있으면 제거
  const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!json || json.length === 0) {
    content.innerHTML = '<div class="status">데이터가 없습니다.</div>';
    return;
  }

  // 첫 번째 열이 모두 비어있으면 제거
  const firstColEmpty = json.every(row => row[0] === '' || row[0] === null || row[0] === undefined);
  const data = firstColEmpty ? json.map(row => row.slice(1)) : json;

  const headers = data[0];
  const rows = data.slice(1).filter(row => row.some(cell => cell !== '' && cell !== null && cell !== undefined));

  const wrap = document.createElement('div');
  wrap.className = 'table-container';

  const table = document.createElement('table');

  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h !== '' && h !== null ? String(h) : '-';
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    headers.forEach((_, j) => {
      const td = document.createElement('td');
      td.textContent = row[j] !== undefined && row[j] !== null ? String(row[j]) : '';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  content.appendChild(wrap);

  document.getElementById('rowCount').textContent = `총 ${rows.length}행`;
}
</script>
</body>
</html>
