<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .container { text-align: center; padding: 40px 20px; }
        .icon { font-size: 4rem; margin-bottom: 24px; }
        h1 { font-size: 1.6rem; color: #2c3e50; margin-bottom: 12px; }
        p { font-size: 1rem; color: #888; margin-bottom: 32px; }
        .back-btn {
            display: inline-block;
            padding: 10px 24px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #34495e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>아직 준비되지 않았습니다.</h1>
        <p>현재 제작 중인 페이지입니다. 조금만 기다려 주세요!</p>
        <a href="../index.html" class="back-btn">← 돌아가기</a>
    </div>
</body>
</html>
