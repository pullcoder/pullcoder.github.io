<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aven 문서 | pullcoder</title>
    <link rel="stylesheet" href="../../assets/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="../../assets/js/site-header.js" defer></script>
    <script src="../../assets/js/fx.js" defer></script>
    <link rel="stylesheet" href="assets/md-view.css">
    <script src="assets/md-view.js"></script>
    <style>
        .doc-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 28px 8px; }
        .doc-top .path { font-family: var(--mono); font-size: .82rem; color: var(--muted); word-break: break-all; }
    </style>
</head>
<body>

    <main class="wrap" style="--accent:#ff2bd6">
        <div class="doc-top">
            <a class="btn btn-ghost" href="index.html#docs">← Aven 문서 목록</a>
            <span class="path" id="doc-path"></span>
        </div>
        <article class="md" id="doc"><p class="doc-msg">문서를 불러오는 중…</p></article>
    </main>

    <script>
    (function () {
        // doc.html?f=aven/docs/plan/PLAN.md
        var box = document.getElementById('doc');
        var file = new URLSearchParams(location.search).get('f') || 'aven/README.md';
        document.getElementById('doc-path').textContent = file;

        MdView.render(box, file).then(function (info) {
            document.title = info.title + ' | Aven';
            if (location.hash) {
                var target = document.getElementById(MdView.anchor(location.hash.slice(1)));
                if (target) target.scrollIntoView();
            }
        }).catch(function () { /* 메시지는 MdView 가 표시 */ });
    })();
    </script>

</body>
</html>
