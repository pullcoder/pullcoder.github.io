<!DOCTYPE html>
<html>

<head>
    <title>예제4-8 list 태그</title>
    <meta charset="UTF-8">
</head>

<body>
    <h2>1. 순서 없는 리스트</h2>
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ul>
    <h2>2. 순서 있는 리스트</h2>
    <ol>
        <li>첫 번째 항목</li>
        <li>두 번째 항목</li>
        <li>세 번째 항목</li>
    </ol>
    <h2>3. 설명 리스트</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language의 약자로, 웹 페이지를 작성하는 데 사용되는 표준 마크업 언어입니다.</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets의 약자로, HTML 요소의 스타일과 레이아웃을 정의하는 데 사용됩니다.</dd>
        <dt>JavaScript</dt>
        <dd>웹 페이지에 동적인 기능을 추가하기 위해 사용되는 프로그래밍 언어입니다.</dd>
    </dl>
</body>

</html>
