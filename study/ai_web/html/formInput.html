<!DOCTYPE html>
<html>

<head>
    <title>예제4-1 form input</title>
    <meta charset="UTF-8">
</head>

<body>
    <p>8. 폼태그 input</p>
    <form action="text.jsp" method="post">
        <label for="fname">이름:</label>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">암호:</label>
        <input type="password" id="lname" name="lname"><br>
        라디오버튼:<input type="radio" value="남성" name="gender">
        <input type="radio" value="여성" name="gender">
        <input type="radio" value="아동" name="gender"><br>
        체크박스:<input type="checkbox" value="남성" name="interests">
        <input type="checkbox" value="여성" name="interests">
        <input type="checkbox" value="아동" name="interests"><br>
    </form>
</body>

</html>
