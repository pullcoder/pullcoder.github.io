<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'></meta>
<title>예제 10-12 Window 메소드</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
<p id="target"></p>
<h3>윈도우 객체</h3>
<p id="win"></p>
<script>
	var w = window.innerWidth
	var h = window.innerHeight
	var x = document.getElementById("target");
	x.innerHTML = "브라우저 윈도우 크기 넓이: " + w + ", 높이: " + h + ".";
	
    // (참고) window 객체의 모든 속성 출력
	for (var i in window ){
		 document.write(i+"<br />");
	}
</script>
<p id="target"></p>
<h3>윈도우 메소드</h3>
<button value="창열기" onclick="openWin()">새창열기</button>
<button value="창이동" onclick="moveWin()">창이동</button>
<button value="창크기" onclick="resizeWin()">창크게 보기</button>
<button value="창닫기" onclick="closeWin()">창닫기</button>
<script>
	var myWindow;
	function openWin() {
	  // window.open(URL, 이름, 속성) 매개변수 적용 예시
	  myWindow = window.open("", "myWindow", "width=250,height=100");
	  myWindow.document.write("공지사항"); 
	}
	function moveWin() {  myWindow.moveTo(600,600); }
	function resizeWin() { myWindow.resizeTo(600,600); }
	function closeWin() {   myWindow.close();  }
</script>
</body>
</html>
