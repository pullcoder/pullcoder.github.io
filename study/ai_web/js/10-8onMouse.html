<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8">
  <title>예제 10-7 &amp; 10-8 통합 예제 | pullcoder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="여주대학교 AI소프트웨어과 AI웹프로그래밍 · JavaScript 수업 자료 - 예제 10-7 &amp; 10-8 통합 예제. pullcoder 학습 기록.">
  <link rel="canonical" href="https://pullcoder.github.io/study/ai_web/js/10-8onMouse.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="pullcoder">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="예제 10-7 &amp; 10-8 통합 예제 | pullcoder">
  <meta property="og:description" content="여주대학교 AI소프트웨어과 AI웹프로그래밍 · JavaScript 수업 자료 - 예제 10-7 &amp; 10-8 통합 예제. pullcoder 학습 기록.">
  <meta property="og:url" content="https://pullcoder.github.io/study/ai_web/js/10-8onMouse.html">
  <meta property="og:image" content="https://pullcoder.github.io/img/logov3.png">
  <script>
    // 예제 10-7: 입력값 대문자 변환 및 글자 수 검사
    function changeText() {
      var x = document.getElementById("txt").value;
      document.getElementById("txt").value = x.toUpperCase();  // 대문자로 변환
      var y = x.length;  // 입력된 문자의 길이 계산

      if (y < 10) {
        alert(y + "자 입력됨. 10자 이상 입력하세요!");
      } else {
        alert("올바른 입력입니다.");
      }
    }

    // 예제 10-8: 마우스 오버/아웃에 따른 스타일 및 텍스트 변경
    function mouseOver() {
      var target = document.getElementById("mouse");
      target.innerHTML = "onMouseOut()";
      target.style.border = "2px solid blue";
    }

    function mouseOut() {
      var target = document.getElementById("mouse");
      target.innerHTML = "onMouseOver()";
      target.style.border = "2px solid red";
    }
  </script>
</head>
<body id="main">
  <!-- Part 1: onchange -->
  <h3 style="text-align:center;">onchange() 이벤트 예제</h3>
  <h3>소문자로 입력한 후, 엔터를 누르거나 포커스를 이동해 보세요.</h3>
  <input type="text" id="txt" size="20" onchange="changeText();">

  <hr style="margin: 30px 0;">

  <!-- Part 2: onmouseover / onmouseout -->
  <h3>마우스를 올려놓으세요</h3>
  <h3 id="mouse" style="text-align:center; border:2px solid red;"
        onmouseover="mouseOver()" onmouseout="mouseOut()">
    onMouseOver()
  </h3>
</body>
</html>
