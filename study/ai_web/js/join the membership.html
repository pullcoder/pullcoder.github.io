<!DOCTYPE html>
<!--
회원가입 페이지 - 입력값 검사(유효성 검사)

1. 사용한 이벤트
   - oninput  : 글자를 입력할 때마다 바로 검사 → 아래에 안내 문구 표시
   - onchange : 체크박스 "전체 동의" 를 바꿀 때
     (휴대폰 칸은 숫자만 남기고 하이픈을 자동으로 넣음 : 01012345678 → 010-1234-5678)
   - onsubmit : 가입하기 버튼 → 모든 항목 검사, 통과하지 못하면 return false 로 전송 막기

2. 사용한 String / 정규식
   - length          : 글자 수 검사
   - trim()          : 앞뒤 공백 제거
   - 정규식.test(값)  : 형식이 맞으면 true, 틀리면 false
       /^[a-z][a-z0-9]{4,11}$/  → 영문 소문자로 시작, 영문 소문자·숫자 5~12자
       /[A-Za-z]/ , /[0-9]/ , /[^A-Za-z0-9]/ → 영문 / 숫자 / 특수문자 포함 여부

※ 서버가 없는 연습용 페이지 → 실제로 저장하지 않고 입력한 내용을 화면에 보여주기만 함
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../header.js" defer></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .join { max-width: 480px; margin: 0 auto; padding: 24px; border: 1px solid #ddd; border-radius: 8px; }
        h1 { margin-top: 0; text-align: center; }
        .row { margin-bottom: 14px; }
        label.title { display: block; font-weight: bold; margin-bottom: 4px; }
        .req { color: #e11d48; }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"], input[type="date"], select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        input.ok { border-color: #16a34a; }
        input.bad { border-color: #e11d48; }
        .msg { font-size: 13px; min-height: 18px; margin-top: 2px; }
        .msg.ok { color: #16a34a; }
        .msg.bad { color: #e11d48; }
        .inline label { margin-right: 12px; }
        .agree { padding: 12px; background: #f7f7f7; border-radius: 6px; }
        .agree label { display: block; }
        .buttons { display: flex; gap: 8px; }
        button { flex: 1; padding: 10px; font-size: 16px; border: 0; border-radius: 6px; cursor: pointer; }
        button[type="submit"] { background: #4f46e5; color: #fff; }
        button[type="reset"] { background: #e5e7eb; }
        #result { max-width: 480px; margin: 20px auto; }
        #result table { border-collapse: collapse; width: 100%; }
        #result th, #result td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
        #result th { background: #f5f5f5; width: 30%; }
    </style>
</head>
<body>

<form class="join" name="joinForm" onsubmit="return joinCheck()" onreset="resetAll()">
    <h1>회원가입</h1>
    <p><span class="req">*</span> 표시는 필수 입력 항목입니다.</p>

    <div class="row">
        <label class="title" for="userId">아이디 <span class="req">*</span></label>
        <input type="text" id="userId" placeholder="영문 소문자로 시작, 5~12자" oninput="checkId()">
        <p class="msg" id="userIdMsg"></p>
    </div>

    <div class="row">
        <label class="title" for="pw">비밀번호 <span class="req">*</span></label>
        <input type="password" id="pw" placeholder="영문 + 숫자 + 특수문자, 8~16자" oninput="checkPw(); checkPw2()">
        <p class="msg" id="pwMsg"></p>
    </div>

    <div class="row">
        <label class="title" for="pw2">비밀번호 확인 <span class="req">*</span></label>
        <input type="password" id="pw2" oninput="checkPw2()">
        <p class="msg" id="pw2Msg"></p>
    </div>

    <div class="row">
        <label class="title" for="userName">이름 <span class="req">*</span></label>
        <input type="text" id="userName" placeholder="한글 또는 영문 2~20자" oninput="checkName()">
        <p class="msg" id="userNameMsg"></p>
    </div>

    <div class="row">
        <label class="title" for="email">이메일 <span class="req">*</span></label>
        <input type="email" id="email" placeholder="example@email.com" oninput="checkEmail()">
        <p class="msg" id="emailMsg"></p>
    </div>

    <div class="row">
        <label class="title" for="phone">휴대폰 번호</label>
        <input type="tel" id="phone" placeholder="숫자만 입력하면 010-1234-5678 로 자동 변환" oninput="checkPhone()" onblur="checkPhone(true)">
        <p class="msg" id="phoneMsg"></p>
    </div>

    <div class="row">
        <label class="title" for="birth">생년월일</label>
        <input type="date" id="birth">
    </div>

    <div class="row inline">
        <span class="title" style="display:block;font-weight:bold;">성별</span>
        <label><input type="radio" name="gender" value="남"> 남</label>
        <label><input type="radio" name="gender" value="여"> 여</label>
        <label><input type="radio" name="gender" value="선택 안 함" checked> 선택 안 함</label>
    </div>

    <div class="row inline">
        <span class="title" style="display:block;font-weight:bold;">관심 분야</span>
        <label><input type="checkbox" name="hobby" value="HTML"> HTML</label>
        <label><input type="checkbox" name="hobby" value="CSS"> CSS</label>
        <label><input type="checkbox" name="hobby" value="JavaScript"> JavaScript</label>
        <label><input type="checkbox" name="hobby" value="Python"> Python</label>
    </div>

    <div class="row agree">
        <label><input type="checkbox" id="agreeAll" onchange="agreeAllCheck()"> <b>영혼까지 전체 동의 🙌</b></label>
        <label><input type="checkbox" class="agreeItem" id="agreeTerms" onchange="agreeItemCheck()"> 이 사이트 주인의 코드를 보고 "와 잘 짰다" 라고 말하겠습니다 <span class="req">(필수)</span></label>
        <label><input type="checkbox" class="agreeItem" id="agreePrivacy" onchange="agreeItemCheck()"> 세미콜론(;) 하나 빠져서 3시간 헤매도 컴퓨터 탓은 안 하겠습니다 <span class="req">(필수)</span></label>
        <label><input type="checkbox" class="agreeItem" id="agreeAd" onchange="agreeItemCheck()"> 매일 아침 "오늘도 console.log('화이팅')" 메시지 수신 (선택)</label>
        <p class="msg" id="agreeMsg"></p>
    </div>

    <div class="buttons">
        <button type="reset">다시 입력</button>
        <button type="submit">가입하기</button>
    </div>
</form>

<!-- 가입 완료 후 입력한 내용이 표시될 자리 -->
<div id="result"></div>

<script>
    // ===== 공통 함수 =====

    function $(id) {
        return document.getElementById(id);
    }

    // 검사 결과를 입력칸 테두리 색과 아래 안내 문구로 표시하는 함수
    // pass : true(통과) / false(실패),  text : 안내 문구
    function show(id, pass, text) {
        $(id).className = pass ? "ok" : "bad";
        $(id + "Msg").className = "msg " + (pass ? "ok" : "bad");
        $(id + "Msg").innerHTML = text;
        return pass;  // 검사 결과를 그대로 돌려줌 → joinCheck() 에서 사용
    }

    // ===== 항목별 검사 함수 =====

    function checkId() {
        var v = $("userId").value.trim();
        if (v.length === 0) return show("userId", false, "아이디를 입력하세요.");
        if (!/^[a-z][a-z0-9]{4,11}$/.test(v)) {
            return show("userId", false, "영문 소문자로 시작하고, 영문 소문자·숫자 5~12자로 입력하세요.");
        }
        return show("userId", true, "사용할 수 있는 형식입니다.");
    }

    function checkPw() {
        var v = $("pw").value;
        if (v.length < 8 || v.length > 16) return show("pw", false, "8~16자로 입력하세요. (현재 " + v.length + "자)");
        if (!/[A-Za-z]/.test(v)) return show("pw", false, "영문을 1개 이상 넣으세요.");
        if (!/[0-9]/.test(v)) return show("pw", false, "숫자를 1개 이상 넣으세요.");
        if (!/[^A-Za-z0-9]/.test(v)) return show("pw", false, "특수문자(!@#$ 등)를 1개 이상 넣으세요.");
        if (v.indexOf($("userId").value) !== -1 && $("userId").value !== "") {
            return show("pw", false, "비밀번호에 아이디를 포함할 수 없습니다.");
        }
        return show("pw", true, "안전한 비밀번호입니다.");
    }

    function checkPw2() {
        var v = $("pw2").value;
        if (v.length === 0) return show("pw2", false, "비밀번호를 한 번 더 입력하세요.");
        if (v !== $("pw").value) return show("pw2", false, "비밀번호가 일치하지 않습니다.");
        return show("pw2", true, "비밀번호가 일치합니다.");
    }

    function checkName() {
        var v = $("userName").value.trim();
        // 한글 또는 영문(띄어쓰기 허용, 예: Hong Gil Dong) 2~20자
        if (!/^[가-힣A-Za-z ]{2,20}$/.test(v)) return show("userName", false, "한글 또는 영문 2~20자로 입력하세요. (숫자·특수문자 불가)");
        return show("userName", true, "");
    }

    function checkEmail() {
        var v = $("email").value.trim();
        if (!/^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(v)) return show("email", false, "이메일 형식이 아닙니다. (예: example@email.com)");
        return show("email", true, "");
    }

    // 숫자를 3 - 4 - 4 자리로 끊어 하이픈을 넣는 함수 (입력 중이면 있는 만큼만)
    function addHyphen(d, first) {
        if (d.length <= first) return d;
        if (d.length <= first + 4) return d.substring(0, first) + "-" + d.substring(first);
        return d.substring(0, first) + "-" + d.substring(first, first + 4) + "-" + d.substring(first + 4);
    }

    function formatPhone(raw) {
        var d = raw.replace(/[^0-9]/g, "");  // 숫자 외의 글자는 모두 버림

        // + 로 시작하고 82 가 붙으면 국제번호 형식 : +82 10-1234-5678
        if (raw.trim().charAt(0) === "+") {
            if (d.length <= 2) return "+" + d;
            var rest = d.substring(2).replace(/^0/, "").substring(0, 10);  // 앞의 0 생략, 최대 10자리
            return "+" + d.substring(0, 2) + " " + addHyphen(rest, 2);
        }
        return addHyphen(d.substring(0, 11), 3);  // 국내 형식 : 최대 11자리
    }

    function checkPhone(final) {
        // 입력할 때마다 숫자만 골라 하이픈(-) 을 자동으로 넣어 다시 표시
        // 예) 01012345678 → 010-1234-5678,  +821012345678 → +82 10-1234-5678
        $("phone").value = formatPhone($("phone").value);

        // 검사할 때는 숫자만 남기고, 국가번호 82 로 시작하면 0 으로 바꿈
        // 예) 010-1234-5678 → 01012345678,  +82 10-1234-5678 / +82 010-1234-5678 → 01012345678
        var v = $("phone").value.replace(/[^0-9]/g, "");
        if (v.indexOf("82") === 0 && $("phone").value.trim().charAt(0) === "+") v = "0" + v.substring(2).replace(/^0/, "");
        // 비어 있거나(선택 항목), 아직 입력 중(10자리 미만)이면 안내문 없이 기본 상태로
        // final 이 true 일 때(칸을 벗어날 때, 가입하기 누를 때)만 자릿수 부족을 빨간 글씨로 알림
        if (v.length === 0 || (v.length < 10 && !final)) {
            $("phone").className = "";
            $("phoneMsg").innerHTML = "";
            return v.length === 0;
        }
        // 형식만 검사 : 숫자 10~11자리 (000-000-0000 / 000-0000-0000)
        if (!/^[0-9]{10,11}$/.test(v)) return show("phone", false, "숫자 10~11자리를 입력하세요. (현재 " + v.length + "자리, 예: 010-1234-5678)");
        return show("phone", true, "");
    }

    // ===== 약관 동의 =====

    var agreeItems = document.getElementsByClassName("agreeItem");

    // "전체 동의" 를 바꾸면 → 아래 항목들을 모두 같은 상태로
    function agreeAllCheck() {
        for (var i = 0; i < agreeItems.length; i++) {
            agreeItems[i].checked = $("agreeAll").checked;
        }
        $("agreeMsg").innerHTML = "";
    }

    // 항목 하나를 바꾸면 → 모두 체크되었을 때만 "전체 동의" 체크
    function agreeItemCheck() {
        var all = true;
        for (var i = 0; i < agreeItems.length; i++) {
            if (!agreeItems[i].checked) all = false;
        }
        $("agreeAll").checked = all;
        $("agreeMsg").innerHTML = "";
    }

    // ===== 가입하기 =====

    function joinCheck() {
        // 모든 항목을 검사 (중간에 멈추지 않도록 각각 변수에 저장)
        var ok = [checkId(), checkPw(), checkPw2(), checkName(), checkEmail(), checkPhone(true)];

        if (ok.indexOf(false) !== -1) {
            alert("입력 내용을 다시 확인하세요.");
            return false;  // 전송 막기
        }
        if (!$("agreeTerms").checked || !$("agreePrivacy").checked) {
            $("agreeMsg").className = "msg bad";
            $("agreeMsg").innerHTML = "필수 약관에 동의 안 하면 못 지나갑니다 🙅 (양심에 손을 얹고 체크하세요)";
            return false;
        }

        showResult();
        return false;  // 서버가 없으므로 실제 전송은 하지 않음
    }

    // 선택한 radio / checkbox 의 값을 모아 문자열로 돌려주는 함수
    function checkedValues(name) {
        var list = document.getElementsByName(name), values = [];
        for (var i = 0; i < list.length; i++) {
            if (list[i].checked) values.push(list[i].value);
        }
        return values.length ? values.join(", ") : "없음";
    }

    // 입력값의 < > 를 문자로 바꿔, HTML 태그로 해석되지 않게 하는 함수
    function safe(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showResult() {
        // 비밀번호는 화면에 보여주지 않고 * 로 가림
        var rows = [
            ["아이디", $("userId").value.trim()],
            ["비밀번호", "*".repeat($("pw").value.length)],
            ["이름", $("userName").value.trim()],
            ["이메일", $("email").value.trim()],
            ["휴대폰", $("phone").value || "없음"],
            ["생년월일", $("birth").value || "없음"],
            ["성별", checkedValues("gender")],
            ["관심 분야", checkedValues("hobby")],
            ["화이팅 메시지", $("agreeAd").checked ? "매일 받기 💪" : "혼자서도 화이팅"]
        ];
        var html = "<h2>" + safe(rows[2][1]) + "님, 가입을 환영합니다!</h2><table>";
        for (var i = 0; i < rows.length; i++) {
            html += "<tr><th>" + rows[i][0] + "</th><td>" + safe(rows[i][1]) + "</td></tr>";
        }
        $("result").innerHTML = html + "</table>";
        $("result").scrollIntoView({ behavior: "smooth" });
    }

    // "다시 입력" → 안내 문구, 테두리 색, 결과 지우기
    function resetAll() {
        var inputs = document.querySelectorAll(".join input");
        for (var i = 0; i < inputs.length; i++) inputs[i].className = inputs[i].className.replace(/\b(ok|bad)\b/g, "").trim();
        var msgs = document.querySelectorAll(".msg");
        for (var j = 0; j < msgs.length; j++) msgs[j].innerHTML = "";
        $("result").innerHTML = "";
    }
</script>
</body>
</html>
