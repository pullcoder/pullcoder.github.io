
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 6-5 위치 설정(positioning: absolute)</title>
  <link rel="stylesheet" href="color.css">
  <style>
    .relative-box {
      position: relative;
      width: 200px;
      height: 50px;
      background: #ffff00;
      margin-bottom: 20px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .absolute-box {
      position: absolute;
      width: 200px;
      height: 50px;
      background: #11ffff;
      top: 100px;
      left: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

  </style>
</head>
<body>
  <h4>절대 배치: absolute</h4>

  <div class="relative-box">position: relative</div>

  <div class="absolute-box">position: absolute</div>
</body>
</html>
