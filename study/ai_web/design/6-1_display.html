<!DOCTYPE html>
<html>
<head>
    <title>예제6-1 display 속성</title>
    <meta charset="utf-8">
    <link type="text/css" rel="stylesheet" href="../css/color.css">
    <style>
        #OList li {
            display: inline;
            border: 1px solid blue;
        }

        #block {
            display: block;
            border: 1px solid green;
        }
    </style> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../header.js" defer></script>
</head>
<body>
    <ol id="OList">
        <li>AI</li>
        <li>Software</li>
        <li>Dept.</li>
        <li>VR</li>
        <li>Convergence</li>
    </ol>

    <i class="block">이탤릭</i>
    <sup class="block">위첨자</sup>
    <sub class="block">아래첨자</sub>
    <a class="block" href="#">링크</a>
</body>
</html>
