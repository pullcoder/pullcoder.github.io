
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 6-6 위치 설정(positioning: fixed)</title>
  <style>
    .relative-box {
      position: relative;
      width: 200px;
      height: 50px;
      background: #ff00ff;
      margin-bottom: 20px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }

    .absolute-box {
      position: absolute;
      width: 200px;
      height: 50px;
      background: #ffff00;
      top: 100px;
      left: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .fixed-box {
      position: fixed;
      width: 200px;
      height: 50px;
      background: #11ffff;
      top: 50px;
      right: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }
  </style>
</head>
<body>
  <h4>고정 위치: fixed</h4>

  <div class="relative-box">position: relative</div>

  <div class="absolute-box">position: absolute</div>

  <div class="fixed-box">position: fixed</div>
</body>
</html>
