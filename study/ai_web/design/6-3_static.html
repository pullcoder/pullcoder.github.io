<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 6-3 위치 설정(positioning): static</title>
  <link rel="stylesheet" href="../css/color.css">
  <style>
    .static-box {
      position: static;
      width: 200px;
      height: 50px;
      margin: 10px 0;
      line-height: 50px;
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .box-red { background: #ff0000; }
    .box-green { background: #11ff00; color: black; }
    .box-blue { background: #0000ff; }
    .box-cyan { background: #00ffff; color: black; }
    .box-yellow { background: #ffff00; color: black; }
  </style>
</head>
<body>
  <h3>static 정적 배치</h3>

  <div class="static-box box-red">position: static</div>
  <div class="static-box box-green">position: static</div>
  <div class="static-box box-blue">position: static</div>
  <div class="static-box box-cyan">position: static</div>
  <div class="static-box box-yellow">position: static</div>
</body>
</html>
