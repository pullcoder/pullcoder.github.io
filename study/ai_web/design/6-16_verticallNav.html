<!DOCTYPE html>
<html>
<head>
    <title>예제6-16 수직 메뉴</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            width: 200px;
        }

        li a {
            display: block;
            background-color: #00000a;
            padding: 8px 16px;
            color: rgb(248, 246, 246);
            text-decoration: none;
        }

        li a:hover {
            background-color: #444444;
            color: white;
        }
    </style>
</head>
<body>
    <ul align="center">
        <!-- 각 메뉴 항목 -->
        <li><a href="#">Home</a></li>
        <li><a href="#">AI</a></li>
        <li><a href="#">HTML5</a></li>
        <li><a href="#">CSS3</a></li>
        <li><a href="#">javascript</a></li>
    </ul>
</body>
</html>
