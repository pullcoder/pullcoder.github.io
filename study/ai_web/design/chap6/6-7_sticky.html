<head>
  <meta charset="utf-8">

  <meta property="og:title" content="예제 6-7 위치 설정(positioning: sticky) | pullcoder">
  <meta property="og:description" content="여주대학교 AI소프트웨어과 AI웹프로그래밍 · CSS 디자인 수업 자료 - 예제 6-7 위치 설정(positioning: sticky). pullcoder 학습 기록.">
  <meta property="og:url" content="https://pullcoder.github.io/study/ai_web/design/chap6/6-7_sticky.html">

  <style>
    body {
      height: 2000px;
      padding: 20px;
    }

    .absolute-box {
      position: absolute;
      width: 200px;
      height: 50px;
      background: #11ff00;
      top: 100px;
      left: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .fixed-box {
      position: fixed;
      width: 200px;
      height: 50px;
      background: #ffff00;
      top: 50px;
      right: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .sticky-box {
      position: sticky;
      width: 200px;
      height: 50px;
      background: #ff11ff;
      top: 50px;
      margin-bottom: 1000px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }
  </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../header.js" defer></script>
</head>
<body>
  <h4>위치 설정: sticky</h4>

  <div class="sticky-box">position: sticky</div>

  <div class="absolute-box">position: absolute</div>

  <div class="fixed-box">position: fixed</div>
</body>
</html>
