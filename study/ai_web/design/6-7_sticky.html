
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 6-7 위치 설정(positioning: sticky)</title>
  <style>
    body {
      height: 2000px;
      padding: 20px;
    }

    .absolute-box {
      position: absolute;
      width: 200px;
      height: 50px;
      background: #11ff00;
      top: 100px;
      left: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .fixed-box {
      position: fixed;
      width: 200px;
      height: 50px;
      background: #ffff00;
      top: 50px;
      right: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .sticky-box {
      position: sticky;
      width: 200px;
      height: 50px;
      background: #ff11ff;
      top: 50px;
      margin-bottom: 1000px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>
  <h4>위치 설정: sticky</h4>

  <div class="sticky-box">position: sticky</div>

  <div class="absolute-box">position: absolute</div>

  <div class="fixed-box">position: fixed</div>
</body>
</html>
