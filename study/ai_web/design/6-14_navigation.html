<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>예제6-14 navigation</title>

    <link rel="stylesheet" href="css/color.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style> 
        #nav {
            overflow: hidden;
            border-top: 2px solid blue;
            border-bottom: 2px solid blue;
            text-align: center;
            padding: 15px 0;
            background: #f9f9f9;
        }

        #nav a {
            display: inline-block;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            color: black;
            transition: color 0.3s, font-weight 0.3s;
        }

        #nav a:hover, #nav a:focus {
            font-weight: bold;
            color: red;
            outline: none;
        }
    </style>
</head>
<body>
    <nav id="nav" aria-label="주요 내비게이션">
        <a href="#">AI</a>
        <a href="../html/htmlTag.html">HTML5</a>
        <a href="../css/cssTag.html">CSS3</a>
    </nav>
</body>
</html>
