<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 4-3 상대 위치 설정(positioning: relative)</title>
  <style>
    .relative-box {
      position: relative;
      width: 250px;
      height: 40px;
      margin: 10px 0;
      line-height: 40px;
      text-align: center;
      font-weight: bold;
      color: white;
    }

    .green {
      background: green;
      top: 50px;
    }

    .blue {
      background: blue;
      top: 25px;
      left: 50px;
    }

    .red {
      background: red;
      left: 150px;
    }

    .yellow {
      background: yellow;
      color: black;
      left: 200px;
    }

    .cyan {
      background: cyan;
      color: black;
      left: 150px;
    }
  </style>
</head>
<body>
  <h3>relative 상대 배치</h3>

  <div class="relative-box green">position: relative</div>

  <div class="relative-box blue">position: relative</div>

  <div class="relative-box red">position: relative</div>

  <div class="relative-box yellow">position: relative</div>

  <div class="relative-box cyan">position: relative</div>
</body>
</html>
