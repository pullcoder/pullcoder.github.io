<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>예제 6-10 투명성(Opacity)</title>
  <style>
    div {
      background-color: blue;
      padding: 10px;
      color: white;
      margin-bottom: 10px;
    }

    #first {
      opacity: 0.2;
    }

    #second {
      opacity: 0.5;
    }

    #third {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h3>투명 Box</h3>

  <div id="first">
    <p>opacity 0.2</p>
  </div>

  <div id="second">
    <p>opacity 0.5</p>
  </div>

  <div id="third">
    <p>opacity 0.8</p>
  </div>

  <div>
    <p>opacity 1 (기본값)</p>
  </div>
</body>
</html>
