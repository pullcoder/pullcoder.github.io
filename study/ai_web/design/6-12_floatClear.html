<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>예제6-12 Float and Clear | pullcoder</title>
  <meta name="description" content="여주대학교 AI소프트웨어과 AI웹프로그래밍 · CSS 디자인 수업 자료 - 예제6-12 Float and Clear. pullcoder 학습 기록.">
  <link rel="canonical" href="https://pullcoder.github.io/study/ai_web/design/6-12_floatClear.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="pullcoder">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="예제6-12 Float and Clear | pullcoder">
  <meta property="og:description" content="여주대학교 AI소프트웨어과 AI웹프로그래밍 · CSS 디자인 수업 자료 - 예제6-12 Float and Clear. pullcoder 학습 기록.">
  <meta property="og:url" content="https://pullcoder.github.io/study/ai_web/design/6-12_floatClear.html">
  <meta property="og:image" content="https://pullcoder.github.io/img/logov3.png">
  <link rel="stylesheet" href="../css/color.css" />
  <style>
    img#no {
      float: none;
      margin-right: 10px;
    }

    img#left {
      float: left;
      margin-right: 10px;
    }

    img#right {
      float: right;
      margin-left: 10px;
    }

    img#clr {
      clear: right;
      display: block;
      margin-top: 120px;
    }

    p {
      overflow: hidden;
    }
  </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../header.js" defer></script>
</head>
<body>
  <h3>float and clear</h3>

  <p>
    <img id="no" src="../img/logo.png" alt="none" style="width:100px; height:100px;">
    이미지 주변의 문자 float:none으로 이미지 주변에 표시되지 않는다. 기본값은 none이다.
  </p>

  <p>
    <img id="left" src="../img/logo.png" alt="left" style="width:100px; height:100px;">
    이미지 주변의 문자 float:left로 이미지 주변에 문자가 왼쪽에 물 흐르듯 표시된다.
  </p>

  <p>
    <img id="right" src="../img/logo.png" alt="right" style="width:100px; height:100px;">
    이미지 주변의 문자 float:right로 이미지 주변에 문자가 오른쪽에 물 흐르듯 표시된다.
  </p>

  <p>
    <img id="clr" src="../img/logo.png" alt="right" style="width:100px; height:100px;">
    이미지 주변의 문자 clear:right로 right로 설정된 float 속성을 해제하며 float:none과 같다.
  </p>
</body>
</html>
