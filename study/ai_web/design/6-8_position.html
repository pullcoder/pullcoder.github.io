  <style>
    body {
      height: 1500px;
      padding: 20px;
    }

    .static-box {
      position: static;
      width: 200px;
      height: 50px;
      background: #ff0000;
      margin-bottom: 20px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }

    .relative-box {
      position: relative;
      width: 200px;
      height: 50px;
      background: #11ffaa;
      top: 25px;
      left: 50px;
      margin-bottom: 20px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: black;
    }

    .absolute-box {
      position: absolute;
      width: 200px;
      height: 50px;
      background: #aa00ff;
      right: 100px;
      top: 200px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }

    .fixed-box {
      position: fixed;
      width: 200px;
      height: 50px;
      background: #00aaff;
      right: 150px;
      top: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }

    .sticky-box {
      position: sticky;
      width: 200px;
      height: 50px;
      background: #333333;
      top: 0px;
      margin-bottom: 1000px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
    }
  </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../header.js" defer></script>
</head>
<body>
  <h4>혼합 위치 설정</h4>

  <div class="sticky-box">position: sticky</div>

  <div class="static-box">position: static</div>

  <div class="relative-box">position: relative</div>

  <div class="absolute-box">position: absolute</div>

  <div class="fixed-box">position: fixed</div>
</body>
</html>
