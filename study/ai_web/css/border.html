<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>예제5-12 경계선스타일</title>
    <style>
        h1{border:4px solid blue;}
        #brdr{border:2px dashed grey; padding:10px;}
    </style>
</head>
<body>
    <div id="brdr">
        <h1>경계선 스타일 굵기, 색상, 종류</h1>
        <p style="border: none;">none.</p>
        <p style="border: 1px dotted red;">dotted.</p><!-- 점선 -->
        <p style="border: 2px dashed blue;">dashed.</p><!-- 대쉬선 -->
        <p style="border: 4px solid green;">solid.</p><!-- 실선 -->
        <p style="border: 8px double orange;">double.</p><!-- 이중선 -->
        <p style="border: 16px groove purple;">groove.</p><!-- 그루브 -->
        <p style="border: 24px ridge brown;">ridge.</p><!-- 릿지 -->
        <p style="border: 32px inset black;">inset.</p><!-- 인셋 -->
        <p style="border: 48px outset cyan;">outset.</p><!-- 아웃셋 -->
    </div>
</body>
</html>
