<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>예제5-8 ID/Class 선택자</title>
    <style>
        p{background-color: blue;}
        #menu{background-color: blue;}
        .first{color:gold}
        h1.second{color:green;}
    </style>
</head>
<body>
    <h1 class="first">div와 iframe</h1>
    <div id="menu">
        <p style="background-color: orange;">하이퍼링크</p>
    </div>
    <h1 class="second">Welcome to AI World</h1>
    <p>HTML5에 CSS3를 연동하기 rel="stylesheet" href="color.css"</p>
    <h2>메뉴</h2>
    <p>외부, 내부, 인라인 스타일 시트</p>
</body>
</html>
