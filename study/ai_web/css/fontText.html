<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>예제5-10 폰트와 텍스트</title>
    <style>
        body{ font:bold 10px serif;}
        #one{color:blue;}
        #two{direction:rtl;}
        #three{letter-spacing: 15px;}
        #four{line-height: 25px; text-decoration: overline;}
        #five{text-align: center; text-decoration: line-through;}
        #six{text-decoration: underline;}
        #seven{text-indent: 10px;}
        #eight{text-transform: lowercase;}
        #nine{text-shadow: 6px 11px 3px red;}
    </style>
</head>
<body>
    <h1 id="one">글자의 색상</h1>
    <h1 id="two">글자의 방향</h1>
    <h1 id="three">글자의 간격</h1>
    <h1 id="four">글자의 줄 높이, 윗줄(Overline)</h1>
    <h1 id="five">글자의 수평 정렬, 취소선(Line-through)</h1>
    <h1 id="six">글자의 장식, 밑줄(underline)</h1>
    <h1 id="seven">글자의 들여쓰기</h1>
    <h1 id="eight">LETTER TRANSFORM</h1>
    <h1 id="nine">문자의 그림자</h1>
</body>
</html>
